[versions]
# Kotlin stays on 2.4.10 with SKIE 0.10.14, which supports Kotlin up to 2.4.10.
kotlin = "2.4.10"
agp = "9.4.1"
compose-multiplatform = "1.12.1"
# Versioned separately from CMP. Expressive APIs (MaterialExpressiveTheme, MotionScheme) are internal in stable
# 1.9.0 and public only in the alphas; revisit when 1.12 is stable.
compose-material3 = "1.12.0-alpha03"
skie = "0.10.14"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.6.0"
cryptography = "0.6.0"
androidx-activity = "1.13.0"
androidx-core = "1.17.0"
jetbrains-lifecycle = "2.11.0"
androidx-test-runner = "1.7.0"

# Slices add their own versions under their marker (keeps parallel merges apart).
# -- addons --
slf4j = "2.0.19"
# app-desktop on Linux: MPRIS over the D-Bus session bus.
dbus-java = "5.2.2"

# -- data --
# Publishes tvOS artifacts (native-driver, coroutines-extensions).
sqldelight = "2.3.2"

# -- server --
flyway = "13.8.0"
postgresql = "42.7.13"
hikaricp = "7.1.0"
nimbus-jose-jwt = "10.10"
logback = "1.6.4"
jackson = "2.22.3"
testcontainers = "2.0.5"

# -- engines --
# ui-compose: Navigation 3 (JetBrains' multiplatform build; stable line for CMP 1.12) and Coil 3 over the app's Ktor
# client (3.6.3 is built against CMP 1.12.0 and Kotlin 2.4.10).
navigation3 = "1.1.2"
coil = "3.6.3"
# ui-compose: QR codes on Android and desktop (Apple draws its own with Core Image).
zxing = "3.5.4"

# -- tracker ids --
# Streaming reads of the anime mapping datasets (trackers/ids); the kotlinx-io Ktor 3.6 already brings.
kotlinx-io = "0.9.1"

# -- watch together --
# Open Watch Party's Kotlin SDK (rooms, sync, matching), on Kotlin 2.4.10, coroutines, serialization and Ktor as above.
openwatchparty = "1.1.0"

# -- android shell --
# Custom Tabs for browser sign-in on Android phones and tablets.
androidx-browser = "1.9.0"
# Native Google sign-in on phones and tablets: Credential Manager with Sign in with Google, and Play services' check
# that the device has them.
androidx-credentials = "1.6.0"
googleid = "1.2.1"
play-services-base = "18.11.0"
# Offline downloads: the foreground dataSync worker the shared engine's transfers run in (DownloadWorker).
androidx-work = "2.12.0"
# Baseline Profiles: android/baselineprofile/ generates the app's profile (Macrobenchmark's BaselineProfileRule over
# UiAutomator), profileinstaller installs it where no store compiles it at install (sideloads, Amazon's store).
benchmark = "1.5.0"
androidx-test-uiautomator = "2.4.0"
androidx-test-ext-junit = "1.3.0"
profileinstaller = "1.4.1"
# Crash reports: Sentry's Java SDK on the desktop, its Android SDK (with the NDK part for native crashes) on Android.
sentry = "8.61.1"
# Sentry's Gradle plugin: the UUID of each release build's R8 mapping file, which its reports name (app-android).
sentry-android-gradle = "6.24.0"


[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
# ui-compose tests only: screens driven through Compose's UI test API (BoardScreenTest).
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrains-lifecycle" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-provider-optimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "cryptography" }
cryptography-provider-jdk = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk", version.ref = "cryptography" }

# -- addons --
# Silences SLF4J's "no providers" warning in dev's fixture recorder (Ktor logs through SLF4J on the JVM).
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
dbus-java-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbus-java" }
dbus-java-transport-unixsocket = { module = "com.github.hypfvieh:dbus-java-transport-native-unixsocket", version.ref = "dbus-java" }

# -- data --
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-sqlite-dialect = { module = "app.cash.sqldelight:sqlite-3-18-dialect", version.ref = "sqldelight" }

# -- server --
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-call-id = { module = "io.ktor:ktor-server-call-id", version.ref = "ktor" }
ktor-server-rate-limit = { module = "io.ktor:ktor-server-rate-limit", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }
ktor-server-forwarded-header = { module = "io.ktor:ktor-server-forwarded-header", version.ref = "ktor" }
ktor-server-body-limit = { module = "io.ktor:ktor-server-body-limit", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

# -- engines --
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# -- tracker ids --
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-serialization-json-io = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-io", version.ref = "serialization" }

# -- watch together --
openwatchparty = { module = "party.openwatch:openwatchparty", version.ref = "openwatchparty" }

# -- android shell --
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
play-services-base = { module = "com.google.android.gms:play-services-base", version.ref = "play-services-base" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-test-uiautomator" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
sentry-java = { module = "io.sentry:sentry", version.ref = "sentry" }
sentry-android-core = { module = "io.sentry:sentry-android-core", version.ref = "sentry" }
sentry-android-ndk = { module = "io.sentry:sentry-android-ndk", version.ref = "sentry" }


[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
sentry-android = { id = "io.sentry.android.gradle", version.ref = "sentry-android-gradle" }

# -- addons --

# -- data --
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }

