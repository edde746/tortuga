# Tortuga for iOS/iPadOS, macOS and tvOS: SwiftUI over the shared Kotlin core (TortugaKit), with mpv through MPVKit.
# Generate the Xcode project with XcodeGen in this directory: `"$(../tools/install_xcodegen.sh <dir>)" generate` (the
# pinned release); the .xcodeproj is not committed. This file is the only place the Apple build is described, and
# tools/set_native_revision.sh keeps the MPVKit pin below equal to mpv-build.lock.json's apple commit by rewriting one
# line (the Gradle build fails when they differ). A committed project.pbxproj would carry a second copy of that pin
# for the script to miss. Apple's pin is ahead of Android's, which stays below mpv-build's pull request #14 until
# mpv-build fixes subtitles showing a refresh early on MediaTek boxes; then one plain
# `tools/set_native_revision.sh <rev>` puts every platform on one revision again.
name: Tortuga

options:
  bundleIdPrefix: com.edde746
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    macOS: "14.0"
  # The version tools/install_xcodegen.sh installs (CI, the release workflow, the UI tests): an older XcodeGen
  # refuses to generate.
  minimumXcodeGenVersion: 2.46.0
  # An Icon Composer document (AppIcon.icon) is a folder Xcode treats as one resource file; listed file by file, its
  # icon.json and images would be copied as loose resources and the icon wouldn't build (XcodeGen issue #1556).
  fileTypes:
    icon:
      file: true

# MARKETING_VERSION and CURRENT_PROJECT_VERSION: the app's version on every platform lives in one file.
configFiles:
  Debug: ../version.xcconfig
  Release: ../version.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Kotlin/Native builds the shared core for arm64 only, so neither the simulators nor the Mac get an x86_64 slice.
    ARCHS: arm64
    # Ad-hoc signing for simulators and the Mac by default. The iOS and tvOS apps sign with the team (their targets
    # below), for real devices; the Mac signs with the team in development-signed UI-test
    # builds and in the release workflow.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    # Release builds keep their symbols in dSYMs, which the release workflow uploads to the crash-report server so
    # crash reports symbolicate (Kotlin's frames too: TortugaKit is static, linked into the app's binary).
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  # MPVKit is mpv-build's Apple distribution: libmpv, FFmpeg and libass as XCFrameworks, and in its resource bundle
  # (MPVKit__MPVKit.bundle, which the apps embed) the licence texts of every component it links.
  MPVKit:
    url: https://github.com/edde746/mpv-build
    revision: 16c95c3114f385b6d265d1d3fae0e26c200ab91f # mpv-build pin
  # Image loading and caching for posters and backgrounds: image loading is native, not in the shared core.
  Nuke:
    url: https://github.com/kean/Nuke
    exactVersion: 13.2.0
  # Updates for the macOS DMG (Tortuga-macOS only; AppKit/Updates.swift). The release workflow signs each
  # DMG with the package's sign_update tool.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # Crash reports, on every platform (App/CrashReporting.swift): its crash handler also records the Kotlin exceptions
  # nothing caught. Its framework carries its own privacy manifest (crash, performance and other diagnostic data, not
  # linked to the user, no tracking).
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.31.0
  # Google sign-in on iPhone, iPad and the Mac (AppleSignInPlatform). Apple TV signs in to Google by its device flow
  # and doesn't link it.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0
  # GoogleSignIn's own dependencies (and theirs), pinned here at the versions its 10.0.0 resolves to, so they don't
  # float within its ranges: no Package.resolved is committed (it would sit in the generated project, a second copy of
  # the MPVKit pin). Nothing links them directly. Move them with GoogleSignIn.
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS.git
    exactVersion: 3.0.0
  AppCheck:
    url: https://github.com/google/app-check.git
    exactVersion: 11.3.2
  GTMAppAuth:
    url: https://github.com/google/GTMAppAuth.git
    exactVersion: 6.0.0
  GTMSessionFetcher:
    url: https://github.com/google/gtm-session-fetcher.git
    exactVersion: 5.3.1
  GoogleUtilities:
    url: https://github.com/google/GoogleUtilities.git
    exactVersion: 8.1.5
  Promises:
    url: https://github.com/google/promises.git
    exactVersion: 2.4.1
  InteropForGoogle:
    url: https://github.com/google/interop-ios-for-google-sdks.git
    exactVersion: 101.0.0

targetTemplates:
  TortugaApp:
    type: application
    settings:
      base:
        PRODUCT_NAME: Tortuga
        PRODUCT_MODULE_NAME: Tortuga
        # One bundle ID for all three apps.
        PRODUCT_BUNDLE_IDENTIFIER: com.edde746.tortuga
        INFOPLIST_FILE: Tortuga/Shared/Info.plist
        # The one Info.plist goes through the C preprocessor, in traditional mode, where two slashes start no comment
        # (Sparkle's feed URL), and without the warning for each apostrophe in its comment, which C would read as an
        # unclosed character constant. Each target defines its platform's name for that platform's keys (TORTUGA_IOS,
        # TORTUGA_MACOS; tvOS none).
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_OTHER_PREPROCESSOR_FLAGS: -traditional -Wno-invalid-pp-token
        INFOPLIST_KEY_CFBundleDisplayName: Tortuga
        # The local network prompt's purpose (iPhone, iPad; the Mac from macOS 15): reaching addons, media or a sync
        # server at home. This English text is the key's base value; the prompt shows i18n's app.localNetworkUsage in
        # the app's language, from the InfoPlist.strings the Kotlin phase below copies in.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Tortuga uses your local network to reach addons, media and a sync server you run at home.
        # Export compliance: Tortuga's own code only hashes, and its encryption is HTTPS (URLSession,
        # and MPVKit's OpenSSL for FFmpeg's streams), which is exempt; App Store Connect then asks nothing at upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The Kotlin script phase reads the repo and writes shared/build, dev/build and ~/.gradle, outside Xcode's
        # script sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # TortugaKit (the KMP umbrella framework, static) is built per platform by the script phase below, from the
        # configuration's Gradle module (TORTUGA_KIT_MODULE). A static framework records no library dependencies, so the
        # app links what it uses: SQLDelight's native driver needs the system libsqlite3. A target adds its own linker
        # flags in TORTUGA_TARGET_LDFLAGS.
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../$(TORTUGA_KIT_MODULE)/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework TortugaKit -lsqlite3 $(TORTUGA_TARGET_LDFLAGS)
      configs:
        # Debug's TortugaKit is :dev's, which exports :shared with the development session (`--dev`, LaunchOptions);
        # Release's is :shared's, without it.
        Debug:
          TORTUGA_KIT_MODULE: dev
        Release:
          TORTUGA_KIT_MODULE: shared
          # Tortuga/Debug (the UI tests' probes, the `--dev` start) needs :dev's TortugaKit and stays out of what ships.
          EXCLUDED_SOURCE_FILE_NAMES: $(SRCROOT)/Tortuga/Debug/*
    dependencies:
      - package: MPVKit
        product: MPVKit
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: Sentry
        product: Sentry
    preBuildScripts:
      # Kotlin integration: TORTUGA_KIT_MODULE's embedAndSignAppleFrameworkForXcode reads SDK_NAME, ARCHS and
      # CONFIGURATION from Xcode and links only the slice this build needs (iosArm64, iosSimulatorArm64, macosArm64,
      # tvosArm64 or tvosSimulatorArm64; :dev's Debug or :shared's Release) into
      # <module>/build/xcode-frameworks/<CONFIGURATION>/<SDK_NAME>, with SKIE's Swift layer compiled in. One phase
      # serves all three platforms, and nothing unused is built. The framework is static, so there is nothing to
      # embed or sign. Gradle's up-to-date checks keep repeat builds cheap. Android is disabled because an Apple build
      # does not need it, and a Mac without an Android SDK can still build.
      #
      # The same Gradle run writes <locale>.lproj/InfoPlist.strings, the Info.plist's purpose strings in every language
      # (build-logic's generateInfoPlistStrings, from shared/i18n), which the phase copies into the app's resources.
      - name: Build TortugaKit (Kotlin)
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          set -e
          cd "$SRCROOT/.."
          ./gradlew ":$TORTUGA_KIT_MODULE:embedAndSignAppleFrameworkForXcode" :shared:generateInfoPlistStrings -Ptortuga.android=false
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          ditto shared/build/generated/tortuga/strings/apple "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
    postBuildScripts:
      # The licence texts About shows: the app's groups of the repository's licenses/ (licenses/apps.json) in its
      # resources' licenses/, which license-texts.py checks after copying, so a build without one of them fails, and
      # mpv-build's, which MPVKit's resource bundle brings and license-texts.py checks there.
      - name: Licence texts
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          set -e
          case "$PLATFORM_NAME" in
            iphoneos|iphonesimulator) app=ios ;;
            appletvos|appletvsimulator) app=tvos ;;
            macosx) app=macos ;;
            *) echo "error: no licence texts for $PLATFORM_NAME" >&2; exit 1 ;;
          esac
          python3 "$SRCROOT/license-texts.py" "$app" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"

  # The UI tests: XCUITest drives the app as a user would, with the remote on tvOS and touches on iOS, finding controls
  # by accessibility identifiers (the Compose UI's probe names). Each platform's tests sit in their own folder beside
  # the shared base class; Pointer holds what iOS and macOS share (the screenshot tour, by touch or the pointer).
  TortugaUITests:
    type: bundle.ui-testing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edde746.tortuga.uitests

targets:
  Tortuga-iOS:
    templates: [TortugaApp]
    platform: iOS
    sources:
      - Tortuga/Shared
      - Tortuga/UIKit
      # Debug builds only: the UI tests' probes and the `--dev` start (the template's Release excludes it).
      - Tortuga/Debug
      # The app icon: an Icon Composer document generated by tools/brand/generate.sh, shared with the Mac.
      - AppIcon.icon
      # libass's last-resort subtitle font (MpvPlayerEngine.swift, subtitleFontDirectory), shared with Android; its SIL
      # OFL 1.1 licence is among the licence texts (licenses/subtitle-font).
      - ../android/mpv/src/main/assets/subtitle-fonts/go-noto-current-regular.ttf
      # The video shader presets' GLSL files, shared with Android and the desktop: a folder reference, so the bundle
      # keeps shaders/<preset family>/<file> (ApplePlatform's shaderFiles).
      - path: ../android/mpv/src/main/assets/shaders
        type: folder
    # Added to the template's MPVKit and Nuke.
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        # Background audio, for picture in picture (Tortuga/Shared/Info.plist's `#if TORTUGA_IOS`).
        INFOPLIST_PREPROCESSOR_DEFINITIONS: TORTUGA_IOS
        # Team signing for real devices: Xcode makes the development profile (Sign in with Apple included); simulators
        # still sign to run locally.
        DEVELOPMENT_TEAM: G88U5B5783
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS: Tortuga/Shared/Tortuga.entitlements
    scheme:
      testTargets: [Tortuga-iOS-UITests]

  Tortuga-tvOS:
    templates: [TortugaApp]
    platform: tvOS
    sources:
      - Tortuga/Shared
      - Tortuga/UIKit
      - Tortuga/Debug
      # Icon Composer has no tvOS icons: the Apple TV keeps the layered icon (and the Top Shelf) in this catalog.
      - Brand.xcassets
      # As the iOS app's.
      - ../android/mpv/src/main/assets/subtitle-fonts/go-noto-current-regular.ttf
      - path: ../android/mpv/src/main/assets/shaders
        type: folder
      # The Top Shelf's App Group and payload key, where the app writes the shelf (TopShelfPublisher).
      - TopShelf/TopShelfContent.swift
    # Added to the template's MPVKit and Nuke: the Top Shelf extension, embedded in the app's PlugIns.
    dependencies:
      - target: Tortuga-tvOS-TopShelf
    settings:
      base:
        # The brand assets hold the layered App Icon and both Top Shelf images; actool writes their Info.plist keys.
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # As the iOS app: team signing for a real Apple TV.
        DEVELOPMENT_TEAM: G88U5B5783
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS: Tortuga/Shared/Tortuga-tvOS.entitlements
    scheme:
      testTargets: [Tortuga-tvOS-UITests]

  # The Apple TV's Top Shelf: the running profile's Continue Watching above the app's icon (TopShelf/TopShelfProvider),
  # read from the App Group the app writes it to. Swift alone, without TortugaKit: the shared core builds the payload
  # in the app.
  Tortuga-tvOS-TopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
        excludes: [Info.plist, TopShelf.entitlements]
    settings:
      base:
        PRODUCT_NAME: TortugaTopShelf
        PRODUCT_BUNDLE_IDENTIFIER: com.edde746.tortuga.TopShelfExtension
        INFOPLIST_FILE: TopShelf/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Tortuga
        TARGETED_DEVICE_FAMILY: "3"
        # App Store Connect rejects an extension with a 64-bit slice whose Info.plist doesn't require arm64; Xcode
        # writes the key for the app, not for an extension.
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arm64
        # As the app's: team signing for a real Apple TV.
        DEVELOPMENT_TEAM: G88U5B5783
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS: TopShelf/TopShelf.entitlements

  Tortuga-macOS:
    templates: [TortugaApp]
    platform: macOS
    sources:
      - Tortuga/Shared
      - Tortuga/AppKit
      - Tortuga/Debug
      - AppIcon.icon
      # As the iOS app's.
      - ../android/mpv/src/main/assets/subtitle-fonts/go-noto-current-regular.ttf
      - path: ../android/mpv/src/main/assets/shaders
        type: folder
    # Added to the template's MPVKit and Nuke.
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        # Sparkle's feed and key and the ordered-row type, without UIKit's keys (Tortuga/Shared/Info.plist's
        # `#if TORTUGA_MACOS`).
        INFOPLIST_PREPROCESSOR_DEFINITIONS: TORTUGA_MACOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        # Picture in picture's PIP.framework, private API (AppKit/PictureInPicture.swift, declared in the bridging
        # header), weakly linked: the Mac app ships as a notarized DMG outside the Mac App Store. The linker
        # finds the SDK's stub of it under its PrivateFrameworks (it prefixes the SDK's root).
        SWIFT_OBJC_BRIDGING_HEADER: Tortuga/AppKit/Tortuga-Bridging-Header.h
        TORTUGA_TARGET_LDFLAGS: -F/System/Library/PrivateFrameworks -weak_framework PIP
    scheme:
      testTargets: [Tortuga-macOS-UITests]

  Tortuga-iOS-UITests:
    templates: [TortugaUITests]
    platform: iOS
    sources: [TortugaUITests/Shared, TortugaUITests/Pointer, TortugaUITests/iOS]
    dependencies:
      - target: Tortuga-iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"

  Tortuga-tvOS-UITests:
    templates: [TortugaUITests]
    platform: tvOS
    sources:
      - TortugaUITests/Shared
      - TortugaUITests/tvOS
      # The Top Shelf's mapping, under TopShelfContentTests, with the shared core's fixture of the payload it reads.
      - TopShelf/TopShelfContent.swift
      - path: ../shared/src/commonTest/fixtures/top-shelf/continue-watching.json
        buildPhase: resources
    dependencies:
      - target: Tortuga-tvOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "3"

  Tortuga-macOS-UITests:
    templates: [TortugaUITests]
    platform: macOS
    sources: [TortugaUITests/Shared, TortugaUITests/Pointer, TortugaUITests/macOS]
    dependencies:
      - target: Tortuga-macOS
    settings:
      base:
        # The runner may listen on 127.0.0.1 (the sync tests' relay) and make the fake Discord's socket under
        # /private/tmp/tortuga-discord; development-signed UI-test builds name this file too.
        CODE_SIGN_ENTITLEMENTS: TortugaUITests/Tortuga-macOS-UITests.entitlements
